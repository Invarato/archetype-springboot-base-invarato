# Configuracion del perfil `test`: se SUPERPONE a application.yaml, no lo sustituye.
#
# ⚠️ Antes esto se llamaba application.yaml y vivia en src/test/resources. Mismo nombre = el del
# classpath de test TAPA al principal, asi que la configuracion de la aplicacion (actuator, logging,
# nombre de la aplicacion...) NO se aplicaba en los tests y no habia forma de notarlo. Con el sufijo
# del perfil, Spring carga el principal y le superpone este.
#
# El esquema de los tests lo construye FLYWAY desde cero sobre una base efimera, y despues Hibernate lo
# valida contra las entidades. Ese ciclo completo es el ORACULO del esquema (docs/migraciones.md): si pasa,
# es que las migraciones se aplican en orden sobre una base vacia Y concuerdan con las entidades.
# Puerto CERO en los tests: que lo elija el sistema.
#
# Hoy ningun test abre un socket —todos usan MockMvc—, pero en cuanto aparezca uno con
# `webEnvironment = RANDOM_PORT`, o alguien lo ponga sin pensar, heredaria el 8080 del fichero comun. Y
# ahi llega el clasico: tienes la aplicacion corriendo con `make run` en otra terminal, lanzas los
# tests y fallan con «Port 8080 was already in use», que no señala al test sino a la maquina. En CI
# pasa igual con dos jobs en el mismo runner.
#
# Poner 0 aqui cuesta una linea y quita esa clase de fallo entera.
server:
  port: 0

spring:
  # Se desactivan los imports de configuracion externa (config server, vault...) que el micro pida en runtime
  config:
    import: ''

  # Testcontainers via URL JDBC: levanta un Postgres efimero, distinto del de desarrollo, para no ensuciar
  # la base con la que estas trabajando.
  datasource:
    url: jdbc:tc:postgresql:18.6:///test

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

  # La cache va APAGADA en los tests a proposito: si no, una prueba podria leer el valor que dejo
  # cacheado otra y el resultado dependeria del orden de ejecucion. Quien quiera probar la cache la
  # enciende para si mismo y se levanta su Redis — ver services/integration/CacheIT.
  cache:
    type: none

  # ⚠️ DevTools no se desactiva desde aqui, y no por olvido: se EXCLUYE del classpath de los tests en
  # el pom (surefire y failsafe). Poner `spring.devtools.restart.enabled: false` parece el arreglo y no
  # lo es — la documentacion de Spring Boot avisa de que esa propiedad **sigue inicializando el
  # classloader de reinicio**, que es justo lo que rompia los tests de cache. El motivo completo esta
  # junto a la exclusion, en app/pom.xml.

# springdoc encendido en tests: es lo que permite a OpenApiContractIT pedir /v3/api-docs y comprobar que
# el contrato versionado sigue coincidiendo con el codigo. En produccion sigue apagado.
# Sin exportacion de trazas en los tests: no hay colector, y arrancar el exportador solo anadiria ruido
# y latencia a cada contexto que se levanta. La correlacion (traceId) sigue funcionando igual.
management:
  tracing:
    export:
      enabled: false
  # Sin Redis levantado, su comprobacion de salud deja /actuator/health en DOWN y respondiendo 503, y
  # con el se cae el test que verifica que las sondas son publicas — por un motivo que no tiene nada
  # que ver con lo que ese test comprueba.
  #
  # ⚠️ Esto solo se apaga en el perfil `test`. En produccion la comprobacion sigue activa y ES la que
  # se quiere: si la cache no responde, la aplicacion tiene un problema y debe decirlo.
  health:
    redis:
      enabled: false

springdoc:
  api-docs:
    enabled: true

# ⚠️ La seguridad NO se desactiva en los tests. Si se desactivara, los tests no estarian probando la
# aplicacion que se despliega, y los fallos de autorizacion aparecerian por primera vez en produccion.
# Los tests se autentican como lo haria un cliente: con un JWT (ver los post-processors `jwt(...)`).
#
# Este secreto solo permite que arranque el decodificador local (configs/DevJwtConfig, perfiles dev y
# test). Los tests con MockMvc ni siquiera lo usan: `jwt()` inyecta la autenticacion ya resuelta.
app:
  dev:
    jwt-secret: test-only-secret-no-usar-fuera-de-los-tests-min-32-bytes
  cors:
    allowed-origins: http://localhost:3000

