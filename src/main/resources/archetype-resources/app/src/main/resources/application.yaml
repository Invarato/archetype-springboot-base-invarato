# UN SOLO fichero de configuracion, a proposito.
# Antes convivian application.properties y application.yaml con contenido distinto y solapado: Spring carga
# los DOS y gana el .properties, asi que editar el .yaml no tenia efecto y nada lo avisaba.
server:
  port: 8080

spring:
  application:
    name: ${artifactId}
  profiles:
    active: dev
  threads:
    virtual:
      # 'enabled', no 'enable'. Con el nombre mal escrito no se activa nada y no hay ningun aviso.
      enabled: true

  # === DEVELOPMENT TOOLS ===
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: false
    add-properties: true

  # === BASE DE DATOS Y ORM ===
  jpa:
    hibernate:
      # SIEMPRE validate. El esquema es de Flyway; si Hibernate pudiera tocarlo, la herramienta de
      # migraciones seria decorativa. Ademas este validate ES el detector de deriva: si anades un campo a
      # una entidad y olvidas la migracion, la aplicacion NO ARRANCA. Ver docs/migraciones.md.
      ddl-auto: validate

    # ⚠️ Spring lo deja en `true` por defecto y AVISA en cada arranque pidiendo que lo configures
    # explicitamente. Aqui va a false, y no es una preferencia:
    #
    # Con open-in-view la sesion de JPA sigue abierta mientras se serializa la respuesta, asi que una
    # relacion perezosa se carga sola, tarde y fuera de la transaccion. El efecto util es que «nunca
    # falla»; el efecto real es que las consultas N+1 se vuelven INVISIBLES — ocurren al serializar,
    # lejos del repositorio, y no aparecen en ningun sitio salvo en la latencia.
    #
    # Aqui ademas sobra: los servicios devuelven DTOs y son transaccionales, asi que todo lo que hay que
    # cargar se carga dentro de la transaccion. Si algun dia salta LazyInitializationException, el fallo
    # NO es este ajuste: es que algo se dejo una entidad a medio cargar para usarla despues.
    open-in-view: false

    properties:
      hibernate:
        # Antidoto generico contra el N+1: al resolver relaciones perezosas, Hibernate las agrupa en una
        # sola consulta con IN (...) en vez de una por fila.
        #
        # Medido en este mismo proyecto, cargando 5 registros y tocando su relacion:
        #   sin esto → 6 consultas (1 + una por fila).  con esto → 2.
        #
        # No sustituye a un JOIN FETCH o un @EntityGraph cuando sabes que vas a necesitar la relacion,
        # pero convierte el caso accidental —el que nadie ve venir— en algo con coste acotado.
        # Lo vigila NPlusUnoIT.
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

  # === DOCKER COMPOSE ===
  # Desactivado a proposito. El soporte de compose de Spring Boot arranca los contenedores y ademas
  # inyecta los datos de conexion, pero aqui sobraba y estorbaba:
  #   - `make run` ya levanta compose-app.yml (`make docker-up`), asi que habia DOS mecanismos haciendo
  #     lo mismo, y dos mecanismos para una cosa es como acaban desincronizados.
  #   - `spring.docker.compose.file` es una ruta RELATIVA al directorio de trabajo, y como la app se
  #     arranca con `mvn -pl app`, el proceso corre desde app/ y no encontraba el fichero. El sintoma
  #     era la aplicacion quejandose de que no hay DataSource, que no apunta a esto por ningun lado.
  # La conexion se declara explicitamente en el perfil dev: predecible y sin depender del directorio
  # desde el que arranques.
  docker:
    compose:
      enabled: false

  # === CACHE / REDIS ===
  cache:
    type: redis
    redis:
      time-to-live: 24h
      key-prefix: '${spring.application.name}:${spring.profiles.active}'
      use-key-prefix: true
      cache-null-values: true
      enable-statistics: true
  data:
    redis:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1

# === MONITORIZACION / ACTUATOR ===
#
# ⚠️ Antes esto exponia TODOS los endpoints y mostraba los valores del entorno. Con `include: '*'`,
# /actuator/env devuelve la configuracion entera —credenciales incluidas— y /actuator/heapdump un volcado
# de memoria. Ahora la seguridad los protege, pero el defecto correcto es no exponer lo que no se usa:
# lo que no esta publicado no se puede filtrar por error.
management:
  endpoints:
    web:
      exposure:
        # health e info para las sondas; prometheus para las metricas. Se amplia por variable de entorno
        # cuando haga falta depurar, sin reconstruir la imagen.
        include: #[[${ACTUATOR_ENDPOINTS:health,info,prometheus}]]#
  endpoint:
    health:
      # `when-authorized` y no `always`: el detalle de salud dice a que sistemas te conectas y cuales
      # estan caidos, que es informacion util para quien ataca.
      show-details: #[[${HEALTH_SHOW_DETAILS:when-authorized}]]#
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  info:
    git:
      mode: full

  # === TRAZAS ===
  # La exportacion va apagada por defecto: sin colector, exportar solo produce errores de conexion en el
  # log cada pocos segundos. La correlacion (traceId en el log y en la cabecera X-Trace-Id) sigue
  # funcionando igual, exporte o no.
  #
  # ⚠️ DOS trampas aqui, las dos silenciosas:
  #
  # 1) El NOMBRE de la propiedad cambio en Spring Boot 4.
  #   Boot 3: management.otlp.tracing.endpoint
  #   Boot 4: management.opentelemetry.tracing.export.otlp.endpoint   <- esta
  #    Con el nombre viejo NO falla nada: la aplicacion arranca, el traceId sigue en los logs y en la
  #    cabecera, y simplemente NO SE EXPORTA NADA. Se descubre mirando un colector vacio.
  #
  # 2) Una cadena VACIA no significa "desactivado": el exportador la valida y revienta el arranque con
  #    "Invalid endpoint, must start with http:// or https://". Por eso lo que se apaga es la
  #    EXPORTACION (`management.tracing.export.enabled`), y el endpoint lleva siempre un valor valido.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: #[[${OTEL_ENDPOINT:http://localhost:4318/v1/traces}]]#
  tracing:
    # La exportacion va APAGADA por defecto: sin colector no tiene sentido, y ademas asi el valor del
    # endpoint da igual. Se enciende por entorno (en dev ya viene encendida).
    export:
      enabled: #[[${OTEL_ENABLED:false}]]#
    sampling:
      # ⚠️ 1.0 = se traza TODO. Bien en local y en pruebas; en produccion con trafico real es caro en
      # red y en almacenamiento. Ahi se baja (0.1 = una de cada diez) con la variable de entorno.
      probability: #[[${OTEL_SAMPLING:1.0}]]#

# === LOGGING ===
# El FORMATO esta en logback-spring.xml (texto en local, JSON en el resto). Aqui solo los NIVELES, que
# son lo que se toca en caliente: subir el detalle de un paquete en produccion sin reconstruir nada.
logging:
  level:
    root: #[[${LOG_LEVEL:INFO}]]#
    ${groupId}: #[[${LOG_LEVEL_APP:DEBUG}]]#
    org.hibernate.SQL: #[[${LOG_LEVEL_SQL:INFO}]]#

  # Ajustes del JSON estructurado. Solo se aplican donde logback usa el encoder estructurado, o sea
  # fuera de local/dev/test: en dev el log sigue siendo texto con colores.
  structured:
    ecs:
      service:
        # El nombre sale de spring.application.name si no se dice otra cosa. El entorno hay que darlo:
        # es lo que permite separar en el recolector los logs de staging de los de produccion.
        environment: ${spring.profiles.active}
    json:
      # Trazas de excepcion: acortadas y con la CAUSA RAIZ PRIMERO.
      #
      # No es cosmetico. Una excepcion envuelta cuatro veces empieza por el envoltorio mas externo, que
      # nunca dice nada, y esconde al final la linea que importa — justo donde los recolectores truncan
      # por longitud. Con `root: first` lo primero que se lee es lo que fallo de verdad.
      stacktrace:
        root: first
        max-length: 2048
        max-throwable-depth: 30
        include-common-frames: false

# === DOCUMENTACION DE LA API ===
# APAGADA por defecto y encendida solo en dev (ver el documento del perfil, mas abajo). En produccion
# regalaria el mapa completo de la API sin que nadie lo pida; el contrato ya viaja en el modulo contract.
# Las rutas estan permitidas en SecurityConfig: son las dos mitades de la misma decision.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
    path: /docs

# === APLICACION ===
app:
  cors:
    # Quien puede llamar a esta API desde un navegador. Vacio = nadie, que es el defecto correcto:
    # que haya que declararlo, en vez de abrirlo y confiar en acordarse de cerrarlo.
    # No se admite '*': con credenciales el navegador lo rechaza de todas formas.
    #
    # ⚠️ El #[[...]]# NO es ruido. Este fichero pasa por Velocity al generarse, y una referencia con
    # valor por defecto (dolar, llave, VARIABLE, dos puntos, defecto) Velocity la intenta resolver y
    # revienta la generacion entera. Escapada, llega literal y la resuelve Spring al arrancar, que es
    # justo lo que se busca. (Este comentario tampoco puede escribir el ejemplo sin escapar: Velocity
    # tambien parsea los comentarios.)
    allowed-origins: #[[${CORS_ALLOWED_ORIGINS:}]]#

# === SEGURIDAD ===
# La cadena de filtros esta SIEMPRE activa (configs/SecurityConfig) y es la misma en todos los entornos.
# Lo unico que cambia por entorno es el emisor de los tokens:
#   - dev/test  -> secreto local HS256 (ver el documento del perfil dev y configs/DevJwtConfig)
#   - los demas -> este issuer-uri, el emisor de verdad con sus claves publicas
spring.security.oauth2.resourceserver.jwt.issuer-uri: #[[${OAUTH2_ISSUER_URI:}]]#

---
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# PERFIL dev — comodidad en local SIN bajar la guardia.
#
# Fijate en lo que NO hay aqui: ni una sola regla de seguridad. Las reglas son las mismas que en
# produccion. Lo unico que cambia es de donde salen los tokens, para no necesitar un servidor de
# identidad levantado solo para poder trabajar. Ver configs/DevJwtConfig.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: dev

  # Los servicios que levanta `make docker-up` (compose-app.yml), en sus puertos publicados. Explicito y
  # no por descubrimiento: funciona igual lo arranques desde el IDE, desde make o a mano.
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: myuser
    password: secret
  data:
    redis:
      host: localhost
      port: 6379

  # El SQL a la vista, SOLO en dev. Estuvo activado para todos los perfiles, produccion incluida, y sale
  # caro por partida doble: cada sentencia se formatea y se escribe (con trafico real es muchisimo log
  # por peticion), y ademas `format_sql` la parte en varias lineas, lo que rompe el log estructurado —
  # una entrada JSON por linea deja de ser una entrada por evento.
  #
  # Para ver el SQL de produccion estan las trazas, que ademas dicen cuanto tardo cada consulta.
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# El colector de trazas que levanta el compose. Con esto, `make run` ya exporta y las trazas se ven en
# http://localhost:16686 sin configurar nada mas.
management:
  tracing:
    export:
      enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces

app:
  cors:
    # El front en local. Anade aqui el puerto que uses.
    allowed-origins: http://localhost:3000,http://localhost:4200,http://localhost:5173
  dev:
    # ⚠️ Secreto DE MENTIRA, y esta en el repositorio a proposito: no protege nada, solo permite firmar
    # tokens en local. Si esto aparece en la configuracion de un entorno real, es un error grave.
    # `make token` acuña un token valido con el.
    jwt-secret: dev-only-secret-no-usar-fuera-de-local-min-32-bytes

# En dev si interesa tener la documentacion navegable: http://localhost:8080/docs
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
# ═══════════════════════════════════════════════════════════════════════════════════════════════
# PERFIL ddl-dump — SOLO para arrancar el esquema la PRIMERA vez (`make db-baseline`).
#
# Vuelca el DDL a partir del METADATO de las entidades, asi que NO necesita ninguna base de datos
# levantada. El resultado es un PUNTO DE PARTIDA que hay que leer antes de commitear: Hibernate nombra
# indices y constraints como le parece y no pone comentarios.
#
# ⚠️ Solo la primera vez. Si ya existe V1__init.sql, regenerarlo cambia su checksum y Flyway aborta con
# "Migration checksum mismatch" alli donde ya estuviera aplicada. Ver docs/migraciones.md.
# ═══════════════════════════════════════════════════════════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: ddl-dump
  # Sin servidor web y sin runners, el contexto arranca, construye el EntityManagerFactory (que es lo que
  # escribe el fichero) y el proceso termina solo.
  main:
    web-application-type: none
  flyway:
    enabled: false
  # No levantes el compose: este volcado no necesita base de datos y tiene que funcionar sin Docker.
  docker:
    compose:
      enabled: false
  datasource:
    # DataSource de mentira: hace falta que EXISTA (si no, Boot no puede autoconfigurar JPA) pero no se
    # conecta a el. `initialization-fail-timeout: -1` es lo que evita que Hikari tumbe el arranque al no
    # encontrar la base de datos.
    url: jdbc:postgresql://localhost:5432/ddl-dump-no-conecta
    username: ddl-dump
    password: ddl-dump
    hikari:
      initialization-fail-timeout: -1
  jpa:
    # Fijar el dialecto es imprescindible: sin el, Hibernate querria una conexion real para deducirlo.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-source: metadata
              create-target: target/generated-schema/V1__init.sql
      hibernate:
        hbm2ddl:
          delimiter: ;
        format_sql: true
