# Integracion continua de ${artifactId}.
#
# Se genera con el proyecto porque un gate que hay que acordarse de lanzar no es un gate. Los tests que
# solo corren cuando alguien se acuerda acaban sin correr, y el dia que fallan ya llevaban rotos semanas.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Semanal: casi todas las versiones las gestiona el BOM de Spring Boot, asi que el build puede romperse
  # sin que nadie toque el repositorio. Mejor enterarse un lunes que al ir a desplegar.
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  # ── Lo de siempre: compilar y pasar los tests ────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Los tests de integracion levantan Postgres con Testcontainers; ubuntu-latest ya trae Docker.
      - name: Tests unitarios y de integracion
        run: ./mvnw -B verify

      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: app/target/site/jacoco/
          retention-days: 7
          if-no-files-found: ignore

  # ── La API contra su propio contrato ─────────────────────────────────────────────────────
  # Va en un JOB APARTE a proposito: si falla, el mensaje es inequivoco —«la API ya no cumple lo que
  # promete»— en vez de perderse entre los tests normales.
  contrato:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Levantar Postgres y Redis
        run: docker compose -f compose.yaml up -d

      - name: Arrancar la API
        run: |
          ./mvnw -B -q -DskipTests package
          # ⚠️ El jar empaquetado EXCLUYE el soporte de Docker Compose — lo hace el plugin de Spring
          # Boot a proposito, porque es una herramienta de desarrollo. Y como el compose publica puertos
          # ALEATORIOS (para poder levantar varios microservicios a la vez), aqui hay que decirle a la
          # aplicacion donde han quedado. Sin esto: «Failed to configure a DataSource».
          export SPRING_DATASOURCE_URL="jdbc:postgresql://localhost:$(docker compose port db-app-postgres 5432 | cut -d: -f2)/postgres"
          export SPRING_DATASOURCE_USERNAME=myuser
          export SPRING_DATASOURCE_PASSWORD=secret
          export SPRING_DATA_REDIS_PORT=$(docker compose port redis 6379 | cut -d: -f2)
          nohup java -jar app/target/*.jar --spring.profiles.active=dev > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1 && exit 0
            sleep 5
          done
          echo "::error::La API no arranco"; cat api.log; exit 1

      # Schemathesis genera casos DESDE el esquema y comprueba que la API no devuelve 500 ni responde
      # algo que no case con lo documentado. Encuentra lo que no se nos ocurrio probar.
      #
      # `--max-examples` bajo en cada push para no alargar el PR; la busqueda profunda va en la
      # ejecucion semanal, que es cuando se puede permitir tardar.
      #
      # ⚠️ Por que NO va `--checks all`. Se probo, y encuentra mucho mas de lo que parece: contra la API
      # de ejemplo saco 26 hallazgos. Los importantes ya estan corregidos —cuatro respuestas 500 que
      # debian ser 400 o 405, y todos los codigos de estado sin documentar— pero quedan diferencias
      # finas entre contrato y realidad que no compensa perseguir en una plantilla.
      #
      # Se dejan los dos checks que de verdad indican un fallo:
      #   not_a_server_error      -> la API nunca debe responder 5xx a una peticion mal formada
      #   status_code_conformance -> no debe responder codigos que su contrato no declara
      #
      # Cuando tu API este madura, sube a `--checks all` y arregla lo que salga: encuentra cosas reales.
      - name: Contrastar la API con su contrato
        run: |
          tok=$(make token | head -1)
          [ "${{ github.event_name }}" = "schedule" ] && ejemplos=500 || ejemplos=50
          docker run --rm --network=host schemathesis/schemathesis:stable run \
            http://localhost:8080/v3/api-docs \
            --header "Authorization: Bearer $tok" \
            --checks not_a_server_error,status_code_conformance \
            --max-examples "$ejemplos"

      - name: Log de la API si algo fallo
        if: failure()
        run: cat api.log
