# ⚠️⚠️  ESTO NO VALE PARA NADA REAL. ⚠️⚠️
#
# Es un Secret de Kubernetes con las credenciales EN CLARO, y esta aqui solo para que el ejemplo de
# despliegue arranque de una pieza. Un `kind: Secret` NO cifra nada: `stringData` se guarda en etcd
# codificado en base64, que es codificacion, no cifrado — cualquiera con permiso de lectura sobre los
# secretos del namespace lo ve en claro.
#
# El problema de verdad no es ese, es este: **este fichero esta en el repositorio**. Poner aqui la
# contraseña real la publica en el historial de git para siempre, y rotarla despues no la borra de ahi.
#
# Que hacer en un entorno real (cualquiera de estas, no las tres):
#   - El gestor de secretos de tu nube (AWS/GCP/Azure) con el driver CSI de secretos.
#   - External Secrets Operator o Sealed Secrets, si quieres seguir declarando el secreto en git:
#     el primero lo trae de fuera, el segundo lo guarda cifrado de modo que solo el cluster pueda abrirlo.
#   - Como minimo, `kubectl create secret generic ...` fuera de git, y borrar este fichero.
#
# Si esto llega a produccion tal cual, el fallo no sera de Kubernetes.
apiVersion: v1
kind: Secret
metadata:
  name: ${artifactId}-secret
  labels:
    app: ${artifactId}
type: Opaque
stringData:
  db-username: myuser
  db-password: cambiame-esto-no-es-una-contrasena
