# Entorno de desarrollo/integracion.
#   helm upgrade --install <release> ./helm/<chart> -f values-dev.yaml --set image.tag=X.Y.Z
replicaCount: 1

env:
  SPRING_PROFILES_ACTIVE: prod
  LOG_LEVEL: DEBUG
  # Aqui va el emisor de tokens de este entorno. Sin el, la aplicacion no arranca (y lo dice).
  OAUTH2_ISSUER_URI: ""
  CORS_ALLOWED_ORIGINS: ""

database:
  host: ""

# Recursos ajustados: en desarrollo no hace falta reservar como en produccion, y reservar de mas deja
# nodos ocupados sin usar.
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 768Mi

ingress:
  enabled: true
  host: dev.ejemplo.local

autoscaling:
  enabled: false
